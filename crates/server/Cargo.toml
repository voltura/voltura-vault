[package]
name = "voltura-vault-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
rusqlite = { version = "=0.42.0", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.29.2", features = ["serde"] }
base64 = "=0.23.1"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
url = "=2.5.8"
ring = "=0.17.14"
voltura-server-auth = { path = "../server-auth" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[workspace]

[package]
name = "voltura-vault"
version = "0.1.1"
description = "A private vault for passwords, notes, and files"
edition = "2024"
publish = false

[features]
public-desktop = ["tauri/tray-icon", "dep:reqwest", "dep:rustls", "dep:x509-parser", "dep:uuid", "dep:tokio"]
vpn-client = ["tauri/tray-icon", "dep:tokio"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.23.1"
sha2 = "=0.10.9"
rand = { version = "0.8", features = ["getrandom"] }
zeroize = "1.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
x509-parser = { version = "=0.18.1", optional = true }
uuid = { version = "=1.29.2", optional = true }
tokio = { version = "=1.54.1", features = ["sync"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_System_DataExchange", "Win32_System_Memory"] }

[[bin]]
name = "hello-capability"
path = "src/bin/hello-capability.rs"

[[bin]]
name = "voltura-vault"
path = "src/main.rs"
